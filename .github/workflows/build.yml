name: Build FAP (Momentum)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ufbt
        run: pip install ufbt

      - name: Use Momentum firmware SDK
        run: |
          mkdir -p /home/runner/.ufbt
          echo '[firmware]' > /home/runner/.ufbt/settings.toml
          echo 'channel = "https://update.flipperzero.one/momentum/directory.json"' >> /home/runner/.ufbt/settings.toml

      - name: Show SDK config (for debugging)
        run: cat /home/runner/.ufbt/settings.toml

      - name: Build FAP
        run: ufbt build

      - name: Upload .fap artifact
        uses: actions/upload-artifact@v4
        with:
          name: flipper-app-momentum
          path: build/f7-app/*.fap
