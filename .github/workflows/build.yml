name: Build Momentum FAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install ufbt
        run: pip install --upgrade ufbt

      # Download Momentum SDK
      - name: Fetch Momentum SDK
        run: |
          ufbt update \
            --index-url https://up.momentum-fw.dev/firmware/directory.json \
            --channel dev

      - name: Build FAP
        run: ufbt build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flip-autocatch-momentum
          path: dist/*.fap
