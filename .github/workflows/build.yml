# .github/workflows/build.yml  (excerpt)
steps:
  - uses: actions/checkout@v3

  - uses: actions/setup-python@v4
    with:
      python-version: '3.11'

  - name: Install uFBT
    run: pip install --upgrade ufbt

  - name: Switch runner to Momentum SDK
    run: |
      # cache lives in $HOME/.ufbt
      ufbt update \
        --index-url https://up.momentum-fw.dev/firmware/directory.json \
        --channel    release

  - name: Build FAP
    run: ufbt build

  - name: Upload artifact
    uses: actions/upload-artifact@v4
    with:
      name: flip-autocatch-momentum
      path: dist/*.fap
